server.port=8085

# MySQL Database (Docker)
spring.datasource.url=jdbc:mysql://mysql:3306/bookstore?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.cloud.config.enabled=false

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Optional .env loading
spring.config.on-not-found=ignore
spring.config.import=optional:file:${user.dir}/.env[com.example.bookstore.config.DotenvPropertySourceFactory]

# Stripe keys (from environment)
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.public.key=${STRIPE_PUBLIC_KEY}

# Eureka config (DO NOT use localhost in Docker)
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Mail config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Feign config
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
spring.cloud.openfeign.enabled=true
feign.compression.request.enabled=false

# URL of the user-service (Docker)
user-service.url=http://user-service:8081

# JWT
app.jwtSecret=yourSecretKeyHere12345678901234567890123456789012
app.jwtExpirationMs=86400000

# Logging
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.reactor.netty.http.client=DEBUG
