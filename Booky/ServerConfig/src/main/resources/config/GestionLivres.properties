# File upload configuration
spring.servlet.multipart.max-file-size=900MB
spring.servlet.multipart.max-request-size=900MB
spring.servlet.multipart.enabled=true

# File storage
file.upload-dir=uploads/

# Server configuration
server.port=8095

# Application name - this should match what you want in Eureka
spring.application.name=book-service

# Disable config server (using Docker environment variables instead)
spring.cloud.config.enabled=false

# Eureka configuration for Docker
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# Eureka health and resilience
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90
eureka.client.registry-fetch-interval-seconds=5
eureka.client.eureka-service-url-poll-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.instance-info-replication-interval-seconds=5

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# JWT Configuration (if needed)
app.jwtSecret=mySecretKey

# Database configuration (H2 for development)
spring.datasource.url=jdbc:h2:file:./Database/Data/Livres
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# NO CORS CONFIGURATION - Gateway handles all CORS