spring.application.name=GestionLivres

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# H2 credentials - Using custom user 'Booky' (admin) with no password
spring.datasource.username=Sarra
spring.datasource.password=
spring.datasource.url=jdbc:h2:file:./Database/Data/Livres;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver

# Add JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.security.enabled=false

server.port=8095

# Disable Config Client temporarily to avoid connection issues
spring.cloud.config.enabled=false
spring.config.import=optional:configserver:http://config-server:8888

# JWT secret
app.jwtSecret=yourSecretKeyHere12345678901234567890123456789012

# File upload path (will be overridden by environment variable in Docker)
file.upload-dir=${FILE_UPLOAD_DIR:/uploads}

# Eureka discovery
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600
